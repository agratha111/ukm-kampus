<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Admin UKM</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 96%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .error { color: red; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Login Administrator</h2>
        <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">Kelola Data UKM Universitas IPWIJA</p>
        
        <!-- Pesan Error Login -->
        <div class="error" th:if="${param.error != null}">Username atau password salah!</div>
        
        <form action="/admin/login" method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Masuk Sistem</button>
        </form>
        <br>
        <a href="/" style="color:#888; text-decoration:none; font-size:0.85rem;">← Kembali ke Beranda</a>
    </div>
</body>
</html>
