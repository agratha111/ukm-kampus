<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin | Universitas IPWIJA</title>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 20px; background: #f8f9fa; color:#333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 25px; }
        form { background: #f1f3f5; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; }
        input[type="text"], textarea { width: 97%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        textarea { height: 80px; resize: vertical; }
        .btn-submit { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f1f3f5; color: #555; }
        .btn-delete { color: #dc3545; text-decoration: none; font-weight: 500; }
        .btn-logout { background: #dc3545; color: white; padding: 8px 16px; text-decoration: none; border-radius: 6px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Panel Manajemen Data UKM</h2>
            <a href="/admin/logout" class="btn-logout">Keluar Sistem</a>
        </div>

        <!-- Form Input Penambahan Data UKM -->
        <h3>➕ Tambah Unit Kegiatan Mahasiswa (UKM) Baru</h3>
        <form action="/admin/tambah-ukm" method="POST">
            <div class="form-group">
                <label>Nama UKM *</label>
                <input type="text" name="nama" placeholder="Contoh: UKM Paduan Suara" required>
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp Pengurus *</label>
                <input type="text" name="kontakWa" placeholder="Contoh: 62812345678" required>
            </div>
            <div class="form-group">
                <label>Visi UKM</label>
                <textarea name="visi" placeholder="Tulis visi organisasi..."></textarea>
            </div>
            <div class="form-group">
                <label>Misi UKM</label>
                <textarea name="misi" placeholder="Tulis misi organisasi..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Simpan ke Database</button>
        </form>

        <!-- Tabel Monitoring Data -->
        <h3>📋 Daftar UKM Terdaftar</h3>
        <table>
            <thead>
                <tr>
                    <th>Nama UKM</th>
                    <th>WhatsApp</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <!-- Loop Rendering via Thymeleaf -->
                <tr th:each="ukm : ${listUkm}">
                    <td th:text="${ukm.nama}" style="font-weight: 500;"></td>
                    <td th:text="${ukm.kontakWa}"></td>
                    <td>
                        <a th:href="@{'/admin/hapus-ukm/' + ${ukm.id}}" 
                           class="btn-delete" 
                           onclick="return confirm('Apakah Anda yakin ingin menghapus UKM ini?')">Hapus</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listUkm)}">
                    <td colspan="3" style="text-align: center; color: #999; padding: 20px;">Belum ada data UKM. Silakan tambah data di atas.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
