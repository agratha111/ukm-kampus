<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin UKM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; min-height: 100vh; background-color: #f1f5f9; color: #334155; }
        
        .sidebar { width: 260px; background: #0f172a; color: white; padding: 25px 20px; display: flex; flex-direction: column; box-shadow: 4px 0 10px rgba(0,0,0,0.05); }
        .sidebar h2 { font-size: 20px; font-weight: 700; margin-bottom: 30px; text-align: center; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 15px;}
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px 15px; margin: 5px 0; border-radius: 8px; font-weight: 500; transition: 0.3s; }
        .sidebar a:hover { background: #1e293b; color: white; }
        .sidebar a.active { background: #3b82f6; color: white; }
        .btn-logout { background: rgba(239, 68, 68, 0.1); color: #ef4444 !important; margin-top: auto !important; text-align: center; border: 1px solid #ef4444;}
        .btn-logout:hover { background: #ef4444 !important; color: white !important; }
        
        .content { flex: 1; padding: 40px; }
        .header-title { font-size: 28px; font-weight: 700; color: #0f172a; margin-bottom: 30px; }
        
        /* Card Form Tambah */
        .form-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid #10b981; }
        .form-card h3 { font-size: 18px; color: #0f172a; margin-bottom: 20px; }
        .form-inline { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .form-inline input { flex: 1; min-width: 200px; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s;}
        .form-inline input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        .btn-simpan { background: #10b981; color: white; padding: 12px 25px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; white-space: nowrap;}
        .btn-simpan:hover { background: #059669; transform: translateY(-2px); }

        /* Table Styling */
        .table-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .table-card h3 { font-size: 18px; color: #0f172a; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { color: #334155; font-size: 15px; }
        tr:hover td { background: #f8fafc; }
        
        .btn-hapus { background: #ef4444; color: white; padding: 8px 15px; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 600; transition: 0.2s; display: inline-block;}
        .btn-hapus:hover { background: #dc2626; box-shadow: 0 2px 5px rgba(239,68,68,0.4); }
        .empty-state { text-align: center; padding: 30px; color: #94a3b8; font-style: italic; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Panel Admin</h2>
        <a href="/admin/dashboard" class="active">📊 Kelola Data</a>
        <a href="/admin/logout" class="btn-logout">🚪 Logout</a>
    </div>
    
    <div class="content">
        <h1 class="header-title">Manajemen Database UKM</h1>
        
        <div class="form-card">
            <h3>Tambah Unit Kegiatan Mahasiswa</h3>
            <form action="/admin/tambah-ukm" method="POST" class="form-inline">
                <input type="text" name="nama" placeholder="Nama UKM (Contoh: Robotik)" required>
                <input type="text" name="kontakWa" placeholder="Nomor WA Ketua (Contoh: 62812345...)" required>
                <button type="submit" class="btn-simpan">+ Simpan ke Database</button>
            </form>
        </div>

        <div class="table-card">
            <h3>Daftar UKM Aktif</h3>
            <table>
                <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="40%">Nama UKM</th>
                        <th width="35%">Kontak WhatsApp</th>
                        <th width="15%">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ukm : ${listUkm}">
                        <td th:text="${ukm.id}"></td>
                        <td th:text="${ukm.nama}" style="font-weight: 500;"></td>
                        <td th:text="${ukm.kontakWa}"></td>
                        <td>
                            <a th:href="@{/admin/hapus-ukm/{id}(id=${ukm.id})}" class="btn-hapus" onclick="return confirm('Data akan dihapus permanen dari sistem. Lanjutkan?')">Hapus</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listUkm)}">
                        <td colspan="4" class="empty-state">Belum ada data UKM di database.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
